packages:
  - apps/*
  - packages/*

storeDir: .pnpm-store
cacheDir: .pnpm-store/cache
saveExact: true

allowBuilds:
  esbuild: true
  sharp: true
  unrs-resolver: true

minimumReleaseAgeExclude:
  - prettier@3.10.0

patchedDependencies:
  picomatch@2.3.2: patches/picomatch@2.3.2.patch
  picomatch@4.0.7: patches/picomatch@4.0.7.patch
